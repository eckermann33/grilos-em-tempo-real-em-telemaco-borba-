<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Grilos - Telêmaco Borba</title>
  <style>
    /* Estilos básicos */
    body {
      background-color: #202124;
      color: #e8eaed;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
      text-align: center;
    }

    h2 {
      font-size: 2em;
      margin-top: 5px;
      color: #8ab4f8;
      text-align: center;
    }

    .counter-box {
      background: #282c34;
      padding: 20px 50px;
      border-radius: 15px;
      box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.4);
      margin-top: 20px;
    }

    .counter {
      font-size: 4em;
      font-weight: bold;
      color: #4caf50;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 5px;
      overflow: hidden;
    }

    .digit {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 80px;
      perspective: 1000px;
    }

    .digit span {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      text-align: center;
      line-height: 80px;
      font-size: 4em;
      font-weight: bold;
      color: #4caf50;
      transform-origin: center bottom;
      transform: rotateX(0deg);
      transition: transform 0.5s ease-in-out;
    }
  </style>
</head>
<body>
  <h1>Contador de Grilos</h1>
  <h2>Telêmaco Borba - PR</h2>
  <div class="counter-box">
    <div id="counter" class="counter">
      <!-- Os dígitos começam vazios e serão preenchidos via JavaScript -->
    </div>
  </div>

  <script>
    // Valor inicial do contador
    const valorInicial = 53742918;
    let valorAtual = valorInicial;

    // Função para renderizar o contador com dígitos como um odômetro
    function renderCounter(valor) {
      const counterElement = document.getElementById("counter");
      const valorString = valor.toString();
      while (counterElement.children.length < valorString.length) {
        const digitContainer = document.createElement("div");
        digitContainer.classList.add("digit");
        digitContainer.innerHTML = '<span>0</span>';
        counterElement.appendChild(digitContainer);
      }
      // Atualiza cada dígito para rodar
      valorString.split("").forEach((num, i) => {
        const digit = counterElement.children[i];
        const currentSpan = digit.querySelector("span");
        if (currentSpan.textContent !== num) {
          currentSpan.style.transform = "rotateX(90deg)";
          setTimeout(() => {
            currentSpan.textContent = num;
            currentSpan.style.transform = "rotateX(0deg)";
          }, 200);
        }
      });
    }

    // Atualização do contador com pequenos passos e direção variada
    function atualizarContador() {
      // Decide se deve subir ou descer
      const variar = Math.random() < 0.5 ? -1 : 1;

      // Incrementa ou decrementa um pequeno valor entre 0 e 3 dígitos
      const variacao = Math.floor(Math.random() * 8) * variar;

      // Calcula o novo valor com limite de variação
      valorAtual = Math.max(valorInicial - 50, Math.min(valorAtual + variacao, valorInicial + 50));

      // Renderiza o contador no site
      renderCounter(valorAtual);
    }

    // Inicializa o número no contador
    renderCounter(valorInicial);

    // Atualiza o contador a cada 2 segundos
    setInterval(atualizarContador, 2000);
  </script>
</body>
</html>
